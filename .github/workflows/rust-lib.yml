name: rust-lib

# Reusable CI for a publishable Rust library workspace.
# fmt / deny / build / clippy / test, then publish to the kellnr registry on
# push to main (after green). Callers stay thin:
#
#   jobs:
#     ci:
#       uses: sitehub-bg/sitehub-ci/.github/workflows/rust-lib.yml@v1
#       with:
#         publish-crates: "crate-a crate-b crate-c"   # dependency order
#       secrets:
#         KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
#
# The caller repo must ship a `.cargo/config.toml` defining the `kellnr` registry.

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Toolchain channel for build/clippy/test"
        type: string
        default: "1.96"
      publish-crates:
        description: "Space-separated crate names in dependency order. Empty = no publish."
        type: string
        default: ""
    secrets:
      KELLNR_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # No separate debug `build` job — clippy compiles the workspace anyway, so it is
  # the compile gate. clippy populates the shared cache; test reuses it.
  clippy:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace --no-tests=pass

  publish:
    needs: [clippy, test]
    if: inputs.publish-crates != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-kellnr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      # Publish in the given dependency order; skip versions already on kellnr
      # (so a push without a version bump is a no-op).
      - name: Publish to kellnr
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
          PUBLISH_CRATES: ${{ inputs.publish-crates }}
        run: |
          set -uo pipefail
          for c in $PUBLISH_CRATES; do
            echo "::group::publish $c"
            ver=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$c" '.packages[]|select(.name==$c)|.version')
            pre=$(printf '%s' "$c" | cut -c1-2); mid=$(printf '%s' "$c" | cut -c3-4)
            idx=$(curl -fsS --retry 5 --retry-all-errors --max-time 30 \
              -H "Authorization: $CARGO_REGISTRIES_KELLNR_TOKEN" \
              "https://kellnr.sitehub.bg/api/v1/crates/$pre/$mid/$c" 2>/dev/null || true)
            if printf '%s' "$idx" | grep -q "\"vers\":\"$ver\""; then
              echo "$c@$ver already on kellnr — skip"
            else
              cargo publish -p "$c" --registry kellnr --no-verify --locked \
                || { echo "::error::$c publish failed"; exit 1; }
              echo "$c@$ver published"
            fi
            echo "::endgroup::"
          done
