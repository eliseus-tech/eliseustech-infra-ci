name: rust-api

# Reusable CI/CD for a deployable Rust service on Fly.io.
# fmt / deny / build / clippy / test, then:
#   - push to main  -> deploy <app>-staging
#   - push tag v*   -> deploy <app>-production
# A post-deploy health gate runs only when a public health URL is given (private
# services — reached over 6PN — omit it; the public gateway's smoke covers the path).
#
# Registry: ghcr.io/sitehub-bg/<app>:ci-<sha> (was registry.fly.io/<app>-{env}).
# One image path for both environments — no per-app-namespace retag needed to
# promote staging's image to production (see sitehub-release). GITHUB_TOKEN
# covers push from this workflow; Fly's own image pull does NOT reliably support
# auth against external private registries, so the GHCR packages must be public
# (fine here — these binaries carry no secrets; config comes from Fly env vars,
# per ADR-0031). Set visibility once per package after the first push:
#   gh api -X PATCH /orgs/sitehub-bg/packages/container/<app>/visibility \
#     -f visibility=public
#
#   on:
#     pull_request:
#     push: { branches: [main], tags: ['v*'] }
#   permissions:                     # REQUIRED in the caller: a reusable workflow
#     contents: read                 # cannot grant itself more than the caller has,
#     packages: write                # and GHCR push needs packages:write.
#   jobs:
#     cicd:
#       uses: sitehub-bg/sitehub-infra-ci/.github/workflows/rust-api.yml@v2
#       with:
#         app: sitehub-iam            # env suffix added: -staging / -production
#         staging-health-url: ""      # private service -> no public smoke
#       secrets:
#         FLY_API_TOKEN_STAGING:    ${{ secrets.FLY_API_TOKEN_STAGING }}
#         FLY_API_TOKEN_PRODUCTION: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
#         KELLNR_TOKEN:             ${{ secrets.KELLNR_TOKEN }}
#
# Orgs: staging apps live in the `sitehub-staging` Fly org, production apps in
# `sitehub-production`; shared infra (kellnr) stays in `sitehub`. The org is NOT a
# workflow input -- a Fly deploy token implicitly carries its own org, so the two
# FLY_API_TOKEN_* secrets are what select the target org.

on:
  workflow_call:
    inputs:
      app:
        description: "Base Fly app name; the env suffix is appended (-staging / -production)"
        type: string
        required: true
      staging-config:
        type: string
        default: "fly.staging.toml"
      production-config:
        type: string
        default: "fly.production.toml"
      staging-health-url:
        description: "Public URL smoke-checked after the staging deploy (empty = skip)"
        type: string
        default: ""
      production-health-url:
        type: string
        default: ""
      rust-version:
        type: string
        default: "1.96"
      deploy:
        type: boolean
        default: true
      publish-crates:
        description: "Space-separated crates (dep order) to publish to kellnr on push to main"
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN_STAGING:
        required: false
      FLY_API_TOKEN_PRODUCTION:
        required: false
      KELLNR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # No separate debug `build` job — clippy compiles the workspace anyway, so it is
  # the compile gate. clippy populates the shared cache; test reuses it.
  clippy:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace --no-tests=pass

  publish:
    needs: [clippy, test]
    if: inputs.publish-crates != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-kellnr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - name: Publish to kellnr
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
          PUBLISH_CRATES: ${{ inputs.publish-crates }}
        run: |
          set -uo pipefail
          for c in $PUBLISH_CRATES; do
            echo "::group::publish $c"
            ver=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$c" '.packages[]|select(.name==$c)|.version')
            pre=$(printf '%s' "$c" | cut -c1-2); mid=$(printf '%s' "$c" | cut -c3-4)
            idx=$(curl -fsS --retry 5 --retry-all-errors --max-time 30 \
              -H "Authorization: $CARGO_REGISTRIES_KELLNR_TOKEN" \
              "https://kellnr.sitehub.bg/api/v1/crates/$pre/$mid/$c" 2>/dev/null || true)
            if printf '%s' "$idx" | grep -q "\"vers\":\"$ver\""; then
              echo "$c@$ver already on kellnr — skip"
            else
              cargo publish -p "$c" --registry kellnr --no-verify --locked \
                || { echo "::error::$c publish failed"; exit 1; }
              echo "$c@$ver published"
            fi
            echo "::endgroup::"
          done

  deploy-staging:
    needs: [clippy, test]
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ inputs.app }}-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Persisted BuildKit cache: the cargo-chef dependency layer (surrealdb etc.)
      # compiles once and is reused across runs — no double compile, no remote
      # OOM, no glibc mismatch (build+run both in Docker). scope is per-service so
      # staging and production share one cache.
      - name: Build & push image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sitehub-bg/${{ inputs.app }}:ci-${{ github.sha }}
          secrets: |
            kellnr_token=${{ secrets.KELLNR_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
      - name: Deploy image to Fly (staging)
        run: flyctl deploy --config "$CFG" --app "${APP}-staging" --image "ghcr.io/sitehub-bg/${APP}:ci-${SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
          CFG: ${{ inputs.staging-config }}
          APP: ${{ inputs.app }}
          SHA: ${{ github.sha }}
      - name: Smoke check (staging)
        if: inputs.staging-health-url != ''
        env:
          HEALTH_URL: ${{ inputs.staging-health-url }}
          APP: ${{ inputs.app }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --max-time 20 "$HEALTH_URL" || true)
          echo "GET $HEALTH_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::${APP}-staging not healthy after deploy ($HEALTH_URL returned $code)"
            exit 1
          fi

  deploy-production:
    needs: [clippy, test]
    if: inputs.deploy && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gated by the `production` GitHub Environment — configure required reviewers
    # and/or a wait timer there. Without it, a `v*` tag from any machine holding a
    # push credential deploys straight to production: the one path that bypasses
    # every network boundary between the dev box and production.
    environment: production
    concurrency:
      group: deploy-${{ inputs.app }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same image path as staging (ci-<sha>). When the tagged commit already went
      # through main this is a cache hit and the push is a no-op, so production runs
      # the bit-identical artifact staging validated — the reason for one shared
      # image path rather than per-app-per-env Fly registry namespaces.
      - name: Build & push image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sitehub-bg/${{ inputs.app }}:ci-${{ github.sha }}
          secrets: |
            kellnr_token=${{ secrets.KELLNR_TOKEN }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
      - name: Deploy image to Fly (production)
        run: flyctl deploy --config "$CFG" --app "${APP}-production" --image "ghcr.io/sitehub-bg/${APP}:ci-${SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
          CFG: ${{ inputs.production-config }}
          APP: ${{ inputs.app }}
          SHA: ${{ github.sha }}
      - name: Smoke check (production)
        if: inputs.production-health-url != ''
        env:
          HEALTH_URL: ${{ inputs.production-health-url }}
          APP: ${{ inputs.app }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --max-time 20 "$HEALTH_URL" || true)
          echo "GET $HEALTH_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::${APP}-production not healthy after deploy ($HEALTH_URL returned $code)"
            exit 1
          fi
