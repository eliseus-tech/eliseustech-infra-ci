name: rust-api

# Reusable CI/CD for a deployable Rust service on Fly.io.
# fmt / deny / build / clippy / test, then:
#   - push to main  -> deploy <app>-staging
#   - push tag v*   -> deploy <app>-production
# A post-deploy health gate runs only when a public health URL is given (private
# services — reached over 6PN — omit it; the public gateway's smoke covers the path).
#
#   on:
#     pull_request:
#     push: { branches: [main], tags: ['v*'] }
#   jobs:
#     cicd:
#       uses: sitehub-bg/sitehub-ci/.github/workflows/rust-api.yml@v1
#       with:
#         app: sitehub-iam            # env suffix added: -staging / -production
#         staging-health-url: ""      # private service -> no public smoke
#       secrets:
#         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
#         KELLNR_TOKEN:  ${{ secrets.KELLNR_TOKEN }}

on:
  workflow_call:
    inputs:
      app:
        description: "Base Fly app name; the env suffix is appended (-staging / -production)"
        type: string
        required: true
      staging-config:
        type: string
        default: "fly.staging.toml"
      production-config:
        type: string
        default: "fly.production.toml"
      staging-health-url:
        description: "Public URL smoke-checked after the staging deploy (empty = skip)"
        type: string
        default: ""
      production-health-url:
        type: string
        default: ""
      rust-version:
        type: string
        default: "1.96"
      deploy:
        type: boolean
        default: true
      publish-crates:
        description: "Space-separated crates (dep order) to publish to kellnr on push to main"
        type: string
        default: ""
    secrets:
      FLY_API_TOKEN:
        required: false
      KELLNR_TOKEN:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  build:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --all-targets

  clippy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace

  publish:
    needs: [clippy, test]
    if: inputs.publish-crates != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-kellnr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - name: Publish to kellnr
        env:
          CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
          PUBLISH_CRATES: ${{ inputs.publish-crates }}
        run: |
          set -uo pipefail
          for c in $PUBLISH_CRATES; do
            echo "::group::publish $c"
            out=$(cargo publish -p "$c" --registry kellnr --no-verify --locked 2>&1); rc=$?
            echo "$out"
            if [ "$rc" -eq 0 ]; then
              echo "$c: published"
            elif echo "$out" | grep -qiE "already (exists|uploaded)"; then
              echo "$c: version already on kellnr — skipped"
            else
              echo "::error::$c publish failed (exit $rc)"; exit 1
            fi
            echo "::endgroup::"
          done

  deploy-staging:
    needs: [clippy, test]
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ inputs.app }}-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - name: Deploy to Fly (staging)
        run: flyctl deploy --remote-only --config "$CFG" --app "${APP}-staging"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CFG: ${{ inputs.staging-config }}
          APP: ${{ inputs.app }}
      - name: Smoke check (staging)
        if: inputs.staging-health-url != ''
        env:
          HEALTH_URL: ${{ inputs.staging-health-url }}
          APP: ${{ inputs.app }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --max-time 20 "$HEALTH_URL" || true)
          echo "GET $HEALTH_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::${APP}-staging not healthy after deploy ($HEALTH_URL returned $code)"
            exit 1
          fi

  deploy-production:
    needs: [clippy, test]
    if: inputs.deploy && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-${{ inputs.app }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - name: Deploy to Fly (production)
        run: flyctl deploy --remote-only --config "$CFG" --app "${APP}-production"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CFG: ${{ inputs.production-config }}
          APP: ${{ inputs.app }}
      - name: Smoke check (production)
        if: inputs.production-health-url != ''
        env:
          HEALTH_URL: ${{ inputs.production-health-url }}
          APP: ${{ inputs.app }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --max-time 20 "$HEALTH_URL" || true)
          echo "GET $HEALTH_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::${APP}-production not healthy after deploy ($HEALTH_URL returned $code)"
            exit 1
          fi
