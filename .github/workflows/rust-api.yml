name: rust-api

# Reusable CI/CD for a deployable Rust HTTP service (axum) on Fly.io.
# fmt / deny / build / clippy / test, then (optionally) deploy to Fly on push to
# main and gate on a post-deploy health check. Services that depend on private
# crates from kellnr pass KELLNR_TOKEN so the cargo jobs can fetch them.
#
#   jobs:
#     cicd:
#       uses: sitehub-bg/sitehub-ci/.github/workflows/rust-api.yml@v1
#       with:
#         app: sitehub-iam
#         health-url: https://iam.sitehub.bg/api/ready
#         deploy: true            # set false for CI-only until the Fly app exists
#       secrets:
#         FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
#         KELLNR_TOKEN:  ${{ secrets.KELLNR_TOKEN }}
#
# The caller repo must ship `.cargo/config.toml` defining the `kellnr` registry
# and `global-credential-providers = ["cargo:token"]`.

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      fly-config:
        type: string
        default: "fly.toml"
      health-url:
        type: string
        required: true
      rust-version:
        type: string
        default: "1.96"
      deploy:
        description: "Deploy to Fly on push to main"
        type: boolean
        default: true
    secrets:
      FLY_API_TOKEN:
        required: false
      KELLNR_TOKEN:
        description: "kellnr token so cargo can fetch private sitehub-common-* crates"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  build:
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --all-targets

  clippy:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_REGISTRIES_KELLNR_TOKEN: ${{ secrets.KELLNR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: false
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace

  deploy:
    needs: [clippy, test]
    if: inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --config "$FLY_CONFIG" --app "$APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_CONFIG: ${{ inputs.fly-config }}
          APP: ${{ inputs.app }}
      # Scale-to-zero lets `flyctl deploy` report success without starting the
      # binary, so a crash-on-boot goes unnoticed. Force a start and fail unless
      # the app actually serves.
      - name: Smoke check (healthy after deploy)
        env:
          HEALTH_URL: ${{ inputs.health-url }}
          APP: ${{ inputs.app }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-connrefused \
            --max-time 20 "$HEALTH_URL" || true)
          echo "GET $HEALTH_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::$APP not healthy after deploy ($HEALTH_URL returned $code)"
            exit 1
          fi
